name: Build Eventowki
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
name: Pobierz projekt
      uses: actions/checkout@v5
name: Ustaw Java 25
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '25'
      cache: maven
name: Zbuduj plugin
  run: mvn -B --no-transfer-progress clean verify
name: Udostepnij plugin
uses: actions/upload-artifact@v4
with:
  name: Eventowki-plugin
  path: target/Eventowki-2.0.0.jar
  if-no-files-found: error
